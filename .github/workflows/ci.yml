name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast static gate. audit.py covers JSON validity + py_compile of
  # every *.py in the repo, superseding a scripts/-only compile check.
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Validate JSON
        run: |
          python -c "
          import json, glob, sys
          errors = []
          for f in glob.glob('**/*.json', recursive=True):
              if '.git/' in f:
                  continue
              try:
                  with open(f, encoding='utf-8-sig') as fh:
                      json.load(fh)
                  print(f'OK  {f}')
              except Exception as e:
                  errors.append(f'{f}: {e}')
                  print(f'FAIL {f}: {e}')
          if errors:
              sys.exit(1)
          print('All JSON files valid.')
          "

      - name: Validate Python
        run: |
          python -c "
          import py_compile, glob, sys
          errors = []
          for f in glob.glob('scripts/*.py'):
              try:
                  py_compile.compile(f, doraise=True)
                  print(f'OK  {f}')
              except py_compile.PyCompileError as e:
                  errors.append(f'{f}: {e}')
                  print(f'FAIL {f}: {e}')
          if errors:
              sys.exit(1)
          print('All Python scripts valid.')
          "

      - name: Full repo audit
        run: python audit.py

      - name: Validate skill frontmatter
        run: |
          python -c "
          import os, re, sys
          errors = []
          skills_dir = 'skills'
          for skill_name in sorted(os.listdir(skills_dir)):
              skill_path = os.path.join(skills_dir, skill_name, 'SKILL.md')
              if not os.path.exists(skill_path):
                  errors.append(f'{skill_name}: SKILL.md missing')
                  continue
              with open(skill_path, encoding='utf-8') as f:
                  content = f.read()
              if not re.search(r'^name:\s*' + re.escape(skill_name), content, re.M):
                  errors.append(f'{skill_name}: name field missing or mismatched')
              if 'description:' not in content:
                  errors.append(f'{skill_name}: description field missing')
              if 'Use when' not in content:
                  errors.append(f'{skill_name}: description should start with Use when')
              if errors and errors[-1].startswith(skill_name):
                  print(f'FAIL {skill_name}')
              else:
                  print(f'OK  {skill_name}')
          if errors:
              sys.exit(1)
          print('All skills valid.')
          "

      - name: Check for AI signatures
        run: |
          python -c "
          import importlib.util, os, sys
          spec = importlib.util.spec_from_file_location('cas', 'scripts/check-ai-signature.py')
          m = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)
          EXCLUDE = {
              'AGENTS.md', 'CONTRIBUTING.md', 'SECURITY.md', 'README.md',
              'scripts/check-ai-signature.py', 'scripts/constraint-pinning.py',
              'scripts/validate-skill-format.py',
              'tests/held-out/mutation/test_check_ai_signature_expanded.py',
          }
          errors = []
          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d != '.git']
              for f in files:
                  if not f.endswith(('.md', '.py', '.json', '.sh', '.ps1', '.toml', '.yml', '.yaml')):
                      continue
                  rel = os.path.relpath(os.path.join(root, f), '.').replace(os.sep, '/')
                  if rel in EXCLUDE:
                      continue
                  try:
                      text = open(os.path.join(root, f), encoding='utf-8', errors='replace').read()
                  except OSError:
                      continue
                  for match in m.PATTERN.finditer(text):
                      line_start = text.rfind('\\n', 0, match.start()) + 1
                      line_end = text.find('\\n', match.end())
                      line = text[line_start: line_end if line_end != -1 else len(text)]
                      if any(a.search(line) for a in m.ALLOWED_CONTEXTS):
                          continue
                      errors.append(rel)
                      print(f'FAIL {rel}: AI signature detected')
                      break
          if errors:
              sys.exit(1)
          print('No AI signatures detected.')
          "

      - name: Verify manifest sync
        run: |
          python -c "
          import json, os, sys
          manifest = json.load(open('manifest.json', encoding='utf-8-sig'))
          manifest_names = set(s['name'] for s in manifest.get('skills', []))
          disk_names = set(os.listdir('skills'))
          if manifest_names != disk_names:
              print('Manifest mismatch:')
              print('  Manifest only:', manifest_names - disk_names)
              print('  Disk only:', disk_names - manifest_names)
              sys.exit(1)
          print(f'Manifest sync: {len(manifest_names)} skills = {len(disk_names)} on disk.')
          "

      - name: Whitespace check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          else
            git diff --check "${{ github.event.before }}..${{ github.sha }}" || true
          fi

      - name: Shellcheck shell scripts
        run: shellcheck install.sh export.sh

      - name: Parse install.ps1
        run: |
          pwsh -NoProfile -Command "
            \$tokens = \$null; \$errs = \$null
            [void][System.Management.Automation.Language.Parser]::ParseFile('install.ps1', [ref]\$tokens, [ref]\$errs)
            if (\$errs.Count -gt 0) { \$errs | ForEach-Object { Write-Error \$_.Message }; exit 1 }
            Write-Host 'install.ps1 parses cleanly.'
          "

      - name: Node syntax check
        run: node --check scripts/mermaid-parse-check.js

  # Full pytest suite incl. held-out on real OSes. Windows exercises
  # the native Win32 adapter (Job Objects, SCM); macOS real ps/kqueue;
  # Linux procfs/pidfd seams. 3.11 + 3.14 catches version skew.
  test:
    name: Tests (${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run full suite
        run: python -m pytest tests -q

  # Rust workspace: the installer rebuilds fast-math on user machines;
  # CI must prove it compiles and its tests pass.
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Cargo test
        run: cargo test --manifest-path extensions/rust-core/Cargo.toml --locked

  # Real installer smoke test into a throwaway target per OS.
  # Exercises file copying, config.json {{APPDATA}} expansion, hooks
  # rendering, extension venvs + per-OS requirements resolution, and
  # the rust rebuild.
  install:
    name: Installer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Run install.sh (posix)
        if: runner.os != 'Windows'
        run: |
          export DEVIN_HOME="$RUNNER_TEMP/devin"
          bash install.sh --force
          test -f "$DEVIN_HOME/skills/system-control/SKILL.md"
          test -f "$DEVIN_HOME/extensions/system-control/sc_cli.py"
          ! grep -q '{{APPDATA}}' "$DEVIN_HOME/config.json"
          echo "Install verified: $DEVIN_HOME"

      - name: Run install.ps1 (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'roaming'
          New-Item -ItemType Directory -Force -Path $env:APPDATA | Out-Null
          ./install.ps1 -Force
          if (!(Test-Path "$env:APPDATA\devin\skills\system-control\SKILL.md")) { throw 'skills not installed' }
          if (!(Test-Path "$env:APPDATA\devin\extensions\system-control\sc_cli.py")) { throw 'extension not installed' }
          if ((Get-Content "$env:APPDATA\devin\config.json" -Raw) -match '\{\{APPDATA\}\}') { throw 'config placeholder not expanded' }
          Write-Host "Install verified: $env:APPDATA\devin"

  # Single stable check context for branch protection. Matrix jobs
  # produce per-combination contexts; this aggregates them all into
  # one required check. `if: always()` makes it report failure (not
  # stay pending) when a dependency fails.
  ci:
    name: ci
    if: always()
    needs: [static, test, rust, install]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs must succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python -c "
          import json, os, sys
          needs = json.loads(os.environ['NEEDS'])
          bad = {k: v['result'] for k, v in needs.items() if v['result'] != 'success'}
          for k, v in needs.items():
              print(f'{k}: {v[\"result\"]}')
          if bad:
              print('FAILED:', bad)
              sys.exit(1)
          "
