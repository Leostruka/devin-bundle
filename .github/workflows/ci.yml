name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Validate JSON files
        run: |
          python -c "
          import json, glob, sys
          errors = []
          for f in glob.glob('**/*.json', recursive=True):
              if '.git/' in f:
                  continue
              try:
                  with open(f, encoding='utf-8-sig') as fh:
                      json.load(fh)
                  print(f'OK  {f}')
              except Exception as e:
                  errors.append(f'{f}: {e}')
                  print(f'FAIL {f}: {e}')
          if errors:
              sys.exit(1)
          print('All JSON files valid.')
          "

      - name: Validate Python scripts
        run: |
          python -c "
          import py_compile, glob, sys
          errors = []
          for f in glob.glob('scripts/*.py'):
              try:
                  py_compile.compile(f, doraise=True)
                  print(f'OK  {f}')
              except py_compile.PyCompileError as e:
                  errors.append(f'{f}: {e}')
                  print(f'FAIL {f}: {e}')
          if errors:
              sys.exit(1)
          print('All Python scripts valid.')
          "

      - name: Validate skill frontmatter
        run: |
          python -c "
          import os, re, sys
          errors = []
          skills_dir = 'skills'
          for skill_name in sorted(os.listdir(skills_dir)):
              skill_path = os.path.join(skills_dir, skill_name, 'SKILL.md')
              if not os.path.exists(skill_path):
                  errors.append(f'{skill_name}: SKILL.md missing')
                  continue
              with open(skill_path, encoding='utf-8') as f:
                  content = f.read()
              if not re.search(r'^name:\s*' + re.escape(skill_name), content, re.M):
                  errors.append(f'{skill_name}: name field missing or mismatched')
              if 'description:' not in content:
                  errors.append(f'{skill_name}: description field missing')
              if 'Use when' not in content:
                  errors.append(f'{skill_name}: description should start with Use when')
              if errors and errors[-1].startswith(skill_name):
                  print(f'FAIL {skill_name}')
              else:
                  print(f'OK  {skill_name}')
          if errors:
              sys.exit(1)
          print(f'All {len(os.listdir(skills_dir))} skills valid.')
          "

      - name: Check for AI signatures
        run: |
          python -c "
          import os, re, sys
          PATTERN = re.compile(r'Generated with \[?Devin\]?|Co-Authored-By: Devin|Generated by Claude|Generated by ChatGPT|Generated by GitHub Copilot', re.IGNORECASE)
          # Files that legitimately reference AI signatures (the rule, the checker, docs about the policy)
          EXCLUDE = {
              'AGENTS.md',
              'CONTRIBUTING.md',
              'SECURITY.md',
              'README.md',
              'scripts/check-ai-signature.py',
              'scripts/post-compaction-reminder.py',
              'scripts/validate-skill-format.py',
          }
          errors = []
          for root, dirs, files in os.walk('.'):
              if '.git' in root:
                  continue
              for f in files:
                  path = os.path.join(root, f)
                  rel = os.path.relpath(path, '.').replace('\\\\', '/')
                  if rel in EXCLUDE:
                      continue
                  if f.endswith(('.md', '.py', '.json', '.sh', '.ps1', '.toml')):
                      try:
                          with open(path, encoding='utf-8', errors='replace') as fh:
                              if PATTERN.search(fh.read()):
                                  errors.append(path)
                                  print(f'FAIL {path}: AI signature detected')
                      except:
                          pass
          if errors:
              sys.exit(1)
          print('No AI signatures detected.')
          "

      - name: Verify manifest sync
        run: |
          python -c "
          import json, os, sys
          manifest = json.load(open('manifest.json', encoding='utf-8-sig'))
          manifest_names = set(s['name'] for s in manifest.get('skills', []))
          disk_names = set(os.listdir('skills'))
          if manifest_names != disk_names:
              print('Manifest mismatch:')
              print('  Manifest only:', manifest_names - disk_names)
              print('  Disk only:', disk_names - manifest_names)
              sys.exit(1)
          print(f'Manifest sync: {len(manifest_names)} skills = {len(disk_names)} on disk.')
          "
